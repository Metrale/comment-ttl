# 2026-09-24: Release. Pushing a tag vX.Y.Z builds every target with
# --locked, attests provenance, writes the version and checksums into
# action.yml, re-points the tag at that commit (before any release exists),
# publishes the release, verifies the published action end to end, and
# finally moves the floating v1 tag.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# 2026-09-24: Releases never overlap and are never cancelled half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # 2026-09-24: attest-build-provenance signs with the workflow's OIDC identity
      attestations: write # 2026-09-24: attest-build-provenance stores the attestation on the repository
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: comment-ttl-x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: comment-ttl-aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
            asset: comment-ttl-aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: comment-ttl-x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: comment-ttl-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must match Cargo.toml
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = "' Cargo.toml | cut -d '"' -f 2)
          test "v$version" = "$TAG" || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET"
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/comment-ttl.exe" "dist/$ASSET"
          else
            cp "target/$TARGET/release/comment-ttl" "dist/$ASSET"
          fi
          "dist/$ASSET" --version
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # 2026-09-24: pushes the release commit's tag and creates the release
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Write the version and checksums into action.yml
        id: commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          (cd dist && sha256sum comment-ttl-* > SHA256SUMS && cat SHA256SUMS)
          sum() { grep " $1\$" dist/SHA256SUMS | cut -d ' ' -f 1; }
          python3 - "$version" \
            "$(sum comment-ttl-x86_64-unknown-linux-musl)" \
            "$(sum comment-ttl-aarch64-unknown-linux-musl)" \
            "$(sum comment-ttl-aarch64-apple-darwin)" \
            "$(sum comment-ttl-x86_64-apple-darwin)" \
            "$(sum comment-ttl-x86_64-pc-windows-msvc.exe)" <<'PY'
          import re, sys
          version, linux_x64, linux_arm64, macos_arm64, macos_x64, windows_x64 = sys.argv[1:]
          text = open("action.yml").read()
          def put(key, value):
              global text
              pattern = rf'^(\s*{key}: )"PLACEHOLDER"$' if key.startswith("SHA256_") else rf'^(\s*{key}: )"[^"]*"$'
              text, n = re.subn(pattern, rf'\g<1>"{value}"', text, flags=re.M)
              assert n == 1, f"{key}: {n} matches"
          put("COMMENT_TTL_VERSION", version)
          put("SHA256_LINUX_X64", linux_x64)
          put("SHA256_LINUX_ARM64", linux_arm64)
          put("SHA256_MACOS_ARM64", macos_arm64)
          put("SHA256_MACOS_X64", macos_x64)
          put("SHA256_WINDOWS_X64", windows_x64)
          for value in (linux_x64, linux_arm64, macos_arm64, macos_x64, windows_x64):
              assert re.fullmatch(r"[0-9a-f]{64}", value), f"bad checksum {value!r}"
          assert not re.search(r'^\s*SHA256_\w+: "PLACEHOLDER"$', text, flags=re.M), "a checksum is still a placeholder"
          open("action.yml", "w").write(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action.yml
          git commit -m "release: $TAG" -m "action.yml now carries the version and the sha256 of every release asset."
          git tag -f "$TAG"
          git push --force origin "refs/tags/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "Pin this release by its commit SHA:"
            echo
            echo '```yaml'
            echo "uses: Metrale/comment-ttl@$SHA # $TAG"
            echo '```'
            echo
            echo "Every binary is attested (\`gh attestation verify <file> --repo Metrale/comment-ttl\`). SHA256:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes \
            dist/comment-ttl-* dist/SHA256SUMS

  verify:
    name: verify the published action
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Download, verify and run the released binary through the action
        id: run
        uses: ./
        with:
          comment_ttl: 1 month
          warn_within: 7d
          reference_date: "2026-09-24"
          scan_dirs: ^tests/fixtures/e2e/
          exempt_paths: (^|/)generated/
          fail_on_flag: "false"
          artifact_name: verify-${{ matrix.os }}
      - shell: bash
        env:
          FLAGGED: ${{ steps.run.outputs.flagged }}
          COMMENTS: ${{ steps.run.outputs.comments }}
        run: |
          set -euo pipefail
          test "$FLAGGED" = "$(jq -r .counts.flagged tests/fixtures/e2e/expected.json)"
          test "$COMMENTS" = "$(jq -r .counts.comments tests/fixtures/e2e/expected.json)"

  floating-tag:
    name: move v1
    needs: [publish, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # 2026-09-24: moves the floating major-version tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - env:
          SHA: ${{ needs.publish.outputs.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"
          git push --force origin "$SHA:refs/tags/$major"
          echo "$major -> $SHA"
