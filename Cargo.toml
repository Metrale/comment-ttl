[package]
name = "comment-ttl"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
description = "Fail CI when a code comment has not been re-verified within its time-to-live"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Metrale/comment-ttl"
readme = "README.md"
keywords = ["comments", "lint", "ci", "github-actions", "documentation"]
categories = ["development-tools", "command-line-utilities"]
exclude = [".github/", "tests/", ".comment-ttl.toml"]

[[bin]]
name = "comment-ttl"
path = "src/main.rs"

[lib]
name = "comment_ttl"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
toml = { version = "0.8", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2.0"
insta = { version = "1.42", features = ["yaml", "json", "filters"] }
predicates = "3.1"
proptest = "1.6"
tempfile = "3.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
